name: Update Fund & Stock Data

on:
  schedule:
    # 每 15 分钟更新一次（北京时间：UTC+8）
    - cron: '*/15 * * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch data
        run: python fetch.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data change, skip commit"
          else
            git commit -m "chore: update market data $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
